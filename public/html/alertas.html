<!DOCTYPE html>
<!-- ==========================================================================
     alertas.html — BANDEJA DE ALERTAS
     Página muy corta a propósito: casi todo el contenido (contadores, filtros
     y tarjetas) lo genera ../js/alertas.js dentro de los tres contenedores
     vacíos que están más abajo.
     ========================================================================== -->
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css"><title>Alertas del sistema</title>  <!-- App instalable (PWA): manifiesto, color de la barra y íconos -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f4d36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Combustible">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/pwa.js" defer></script>
</head>
<body>
<main class="pantalla">
<!-- Encabezado común a todas las pantallas internas: logo, título, ubicación,
     fecha (la llena shell.js) y el botón ☰ que abre el menú en celular -->
<header class="encabezado encabezado-compacto">
      <div class="encabezado-control">
        <div class="logo encabezado-logo"><img src="../assets/WhatsApp Image 2026-08-11 at 6.40.45 AM.jpeg" alt="Logo Guaicaramo SAS"></div>
        <h1>Alertas</h1>
      </div>
      <div class="ubicacion ubicacion-compacta">
        <strong>Barranca de Upia, Meta</strong>
        <span data-fecha-encabezado></span> <!-- shell.js escribe aquí la fecha y hora -->
      </div>
      <button class="boton-tres-puntos" type="button" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>
<!-- Panel único de la pantalla. Los tres divs vacíos son los contenedores que
     rellena alertas.js: resumen (contadores), filtros (chips) y el listado. -->
<section class="panel registros alertas-panel"><div class="titulo-tabla"><div><span class="eyebrow">CONTROL Y REVISIÓN</span><h2>Alertas del sistema</h2><p class="subtitulo-vista">Revisa sobrecapacidad, consumos fuera del promedio, horómetros irregulares e inspecciones pendientes.</p></div><button type="button" id="boton-actualizar-alertas">↻ Actualizar</button></div><div id="resumen-alertas" class="resumen-alertas"></div><div id="filtros-alertas" class="filtros-alertas" role="group" aria-label="Filtrar alertas"></div><div id="cuerpo-alertas" class="grid-alertas"></div></section>
</main>
<!-- ORDEN DE CARGA IMPORTANTE: SweetAlert -> auth.js -> shell.js -> control de
     acceso -> script de la pantalla. protegerVista('alertas') saca al usuario
     si no tiene permiso, y aplicarPermisosEnlaces() oculta los enlaces vedados. -->
<script src="/vendor/sweetalert2.all.min.js"></script><script src="../js/auth.js"></script>
  <script src="../js/shell.js"></script><script>if(protegerVista('alertas')){aplicarPermisosEnlaces();}</script><script src="../js/alertas.js"></script>
</body></html>
