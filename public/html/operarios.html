<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css">
  <title>Registro de operarios</title>
</head>
<body>
  <main class="pantalla">
    <!-- Encabezado de la vista de operarios -->
    <header class="encabezado encabezado-compacto">
      <div class="encabezado-control">
        <div class="logo encabezado-logo"><img src="../assets/WhatsApp Image 2026-08-11 at 6.40.45 AM.jpeg" alt="Logo Guaicaramo SAS"></div>
        <h1>Registro de operarios</h1>
      </div>
      <div class="ubicacion ubicacion-compacta">
        <strong>Barranca de Upia, Meta</strong>
        <span data-fecha-encabezado></span>
      </div>
      <button class="boton-tres-puntos" type="button" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- Formulario para agregar operarios a la tabla operarios de MySQL -->
    <section class="panel">
      <form id="formulario-operario" class="formulario-operario" autocomplete="off">
        <div>
          <label for="operario-nombre">Nombre del operario</label>
          <input type="text" id="operario-nombre" maxlength="120" autocomplete="off" required>
        </div>

        <div>
          <label for="operario-cedula">Cedula</label>
          <input type="number" id="operario-cedula" min="0" autocomplete="off" required>
        </div>

        <button type="submit">Agregar operario</button>
      </form>
    </section>

    <!-- Operarios mostrados como tarjetas independientes -->
    <section class="panel registros panel-cartas">
      <div class="titulo-tabla">
        <div>
          <h2>Operarios registrados</h2>
          <p class="subtitulo-seccion">Selecciona visualmente a cada operario desde su tarjeta.</p>
        </div>
        <strong class="contador-registros"><span id="cantidad-operarios">0</span> operarios</strong>
      </div>
      <div id="cuerpo-tabla-operarios" class="cartas-registros cartas-operarios"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    if (protegerVista('operarios')) {
      aplicarPermisosEnlaces();
    }
  </script>
  <script src="../js/operarios.js"></script>
</body>
</html>
