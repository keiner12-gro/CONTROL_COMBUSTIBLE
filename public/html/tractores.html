<!DOCTYPE html>
<!-- ==========================================================================
     tractores.html — ADMINISTRACIÓN DE MAQUINARIA
     Alta de máquinas y fichas con su consumo del mes.
     Lógica en ../js/tractores.js. Requiere el permiso 'tractores'.
     RECUERDA: la "capacidad galones" que se captura aquí es la que dispara las
     alertas de sobrecapacidad al registrar un suministro.
     ========================================================================== -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css">
  <title>Registro de máquinas</title>
  <!-- App instalable (PWA): manifiesto, color de la barra y íconos -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f4d36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Combustible">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/pwa.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <!-- Encabezado de la vista de tractores -->
    <header class="encabezado encabezado-compacto">
      <div class="encabezado-control">
        <div class="logo encabezado-logo"><img src="../assets/WhatsApp Image 2026-08-11 at 6.40.45 AM.jpeg" alt="Logo Guaicaramo SAS"></div>
        <h1>Registro de máquinas</h1>
      </div>
      <div class="ubicacion ubicacion-compacta">
        <strong>Barranca de Upia, Meta</strong>
        <span data-fecha-encabezado></span>
      </div>
      <button class="boton-tres-puntos" type="button" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <!-- Formulario para agregar tractores a la tabla tractores de MySQL -->
    <!-- El número de "item" no se pide: lo calcula solo el servidor -->
    <section class="panel">
      <form id="formulario-tractor" class="formulario-tractor" autocomplete="off">


        <div>
          <label for="tractor-maquina">Maquina</label>
          <!-- Código corto de la máquina; se guarda en mayúsculas -->
          <input type="text" id="tractor-maquina" maxlength="20" autocomplete="off" required>
        </div>

        <div>
          <label for="tractor-descripcion-form">Descripcion</label>
          <!-- La PRIMERA PALABRA de la descripción se usa como "tipo de máquina"
               en los reportes (Tractor, Camión, Excavadora...) -->
          <input type="text" id="tractor-descripcion-form" maxlength="150" autocomplete="off" required>
        </div>

        <div>
          <label for="tractor-centro-costo-form">Centro costo</label>
          <input type="text" id="tractor-centro-costo-form" maxlength="20" autocomplete="off" required>
        </div>

        <div>
          <label for="tractor-capacidad-form">Capacidad galones</label>
          <!-- Capacidad del tanque: base de las alertas de sobrecapacidad -->
          <input type="number" id="tractor-capacidad-form" min="0" step="0.01" autocomplete="off" required>
        </div>

        <button type="submit">Agregar máquina</button>
      </form>
    </section>

    <!-- Maquinas mostradas como tarjetas independientes -->
    <section class="panel registros panel-cartas">
      <div class="titulo-tabla">
        <div>
          <h2>Máquinas registradas</h2>
          <p class="subtitulo-seccion">Cada máquina tiene su propia ficha para consultar y editar rápidamente.</p>
        </div>
        <strong class="contador-registros"><span id="cantidad-tractores">0</span> máquinas</strong>
      </div>
      <!-- Contenedor que llena tractores.js con una ficha por máquina -->
      <div id="cuerpo-tabla-tractores" class="cartas-registros cartas-tractores"></div>
    </section>
  </main>

  <script src="/vendor/sweetalert2.all.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    if (protegerVista('tractores')) {
      aplicarPermisosEnlaces();
    }
  </script>
  <script src="../js/tractores.js"></script>
</body>
</html>
