<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f4d36">
  <title>Sin conexión | Control de Combustible</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           font-family: system-ui, sans-serif; background: #f4f6f3; color: #1f2a24; text-align: center; }
    main { max-width: 420px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { line-height: 1.5; }
    button { margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 10px; background: #1f4d36; color: #fff; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="96" height="96" alt="">
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Lo que hayas escrito en las lecturas de las mangueras queda guardado en este equipo y se enviará solo cuando vuelva la señal.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
